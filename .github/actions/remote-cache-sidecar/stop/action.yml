name: "Remote cache sidecar: stop (deprecated)"
description: >-
  Deprecated: use remote-cache/stop (the same stop). Kept for callers pinned
  to it. Stops what remote-cache-sidecar started: the service first, which drains
  its exports, then, once the drain is done, the engine, then it waits for
  the service to exit. Run it with if: always(), and a timeout-minutes above
  the drain timeout plus 2 minutes: the drain's wait (the drain timeout plus
  5s), then the engine's stop (cut off at 90s), then the cleanup.

inputs:
  name:
    description: "The name given to remote-cache-sidecar"
    required: false
    default: "remote-cache"

outputs:
  logs:
    description: "Where the service's and the engine's logs are (service.log, engine.log)"
    value: ${{ steps.stop.outputs.logs }}

runs:
  using: "composite"
  steps:
    - name: Warn that the action is deprecated
      shell: bash
      run: |
        echo "::warning title=remote-cache-sidecar/stop is deprecated::Use zerobull-consulting/dagger/.github/actions/remote-cache/stop; remote-cache-sidecar/stop is removed after 2027-02-05, 90 days after remote-cache/start landed (zerobull-consulting/dagger#161)."
    - name: Stop the cache service, then the engine
      id: stop
      shell: bash
      env:
        SIDECAR_NAME: ${{ inputs.name }}
      run: '"$GITHUB_ACTION_PATH/../../remote-cache/sidecar.sh" stop'
