name: "Remote cache sidecar: stop"
description: >-
  Stops what remote-cache-sidecar started: the service first, which drains
  its exports, then, once the drain is done, the engine, then it waits for
  the service to exit. Run it with if: always(), and a timeout-minutes above
  the drain timeout plus 25s, with room for the engine's stop (up to 30s).

inputs:
  name:
    description: "The name given to remote-cache-sidecar"
    required: false
    default: "remote-cache"

outputs:
  logs:
    description: "Where the service's and the engine's logs are (service.log, engine.log)"
    value: ${{ steps.stop.outputs.logs }}

runs:
  using: "composite"
  steps:
    - name: Stop the cache service, then the engine
      id: stop
      shell: bash
      env:
        SIDECAR_NAME: ${{ inputs.name }}
      run: '"$GITHUB_ACTION_PATH/../sidecar.sh" stop'
