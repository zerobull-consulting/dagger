name: "Remote cache sidecar (deprecated)"
description: >-
  Deprecated: use remote-cache/start, which installs the CLI with
  dagger/dagger-for-github, pulls both images at once, and stops by itself at
  the end of the job. This alias is kept for callers pinned to it, and is
  removed after 2027-02-05. It runs the same script, and still copies
  the CLI out of the engine image. Runs the remote cache service and a stock engine of one accepted version
  on this runner, and sets up the dagger CLI for later steps; ready once the
  service has welcomed the engine. Stop it at the end of the job with
  remote-cache-sidecar/stop (or remote-cache/stop), with if: always().

inputs:
  role:
    description: >-
      writer (exports to the bucket; for jobs on the default branch) or
      read-only (-export=false and a read-only key; for pull-request jobs)
    required: true
  version:
    description: >-
      The engine version, such as v1.0.0-beta.25: an accept line of the
      service's engine manifest, cmd/cacheservice/compat/engines.txt, at this
      action's commit (default: its first accept line). It selects both
      images: the stock registry.dagger.io/engine of that version, pinned by
      the manifest's digest, whose own CLI is the one set up, and the
      service image that accepts it,
      ghcr.io/zerobull-consulting/dagger-remote-cache:<version>. A version
      the manifest doesn't accept fails the step before anything starts
    required: false
    default: ""
  service-image:
    description: >-
      Overrides the service image, such as a build of your own, or
      ghcr.io/zerobull-consulting/dagger-remote-cache:<commit SHA> (or
      @sha256:...) to pin one build; version still selects the engine. The
      step fails if this service refuses that engine (default: the
      version's dagger-remote-cache:<version>)
    required: false
    default: ""
  engine-image:
    description: >-
      Deprecated, and to be removed: give version instead. The engine image,
      pinned by digest; only with service-image and without version, and
      it warns
    required: false
    default: ""
  s3-endpoint:
    description: "The store's endpoint URL, such as https://nyc3.digitaloceanspaces.com"
    required: true
  s3-region:
    description: "The store's region"
    required: true
  s3-bucket:
    description: "The bucket"
    required: true
  s3-prefix:
    description: >-
      The prefix the service owns in the bucket; empty for the whole bucket.
      Nothing else may write under it.
    required: false
    default: ""
  s3-access-key-id:
    description: "The key's ID, from the caller's secrets. A read-only key for role read-only."
    required: true
  s3-secret-access-key:
    description: "The key's secret, from the caller's secrets"
    required: true
  s3-path-style:
    description: "true for path-style addressing (MinIO); empty for the service's default"
    required: false
    default: ""
  namespace:
    description: "The namespace entries are stored in and imported from (the service's -scope)"
    required: false
    default: "default"
  drain-timeout:
    description: >-
      How long the stop lets the service finish its exports (-drain-timeout).
      Give the stop step a timeout-minutes of at least this plus 2 minutes:
      the drain's wait (this plus 5s), then the engine's stop (cut off at 90s),
      then the cleanup.
    required: false
    default: "10m"
  name:
    description: >-
      Prefix of the containers, volume and network; set another one to run a
      second sidecar in the same job, after the first is stopped. Pass the
      same to the stop action.
    required: false
    default: "remote-cache"
  debug-port:
    description: >-
      Publish the service's debug API on 127.0.0.1:<port> of the runner
      (default: not published). It requires a token, generated for this
      start: send the content of the debug-token-file output as
      Authorization: Bearer <token>
    required: false
    default: ""
  engine-config:
    description: >-
      A file to mount as the engine's engine.json (default: the action's
      engine.json, with the engine's GC off; see README.md)
    required: false
    default: ""
  verbose:
    description: "true: the service logs every cache span (-v)"
    required: false
    default: "false"

outputs:
  dagger:
    description: "The dagger CLI set up for the sidecar (also first on PATH for later steps)"
    value: ${{ steps.start.outputs.dagger }}
  version:
    description: "The engine version the sidecar runs (empty with the deprecated engine-image)"
    value: ${{ steps.start.outputs.version }}
  service-image:
    description: "The service image it runs"
    value: ${{ steps.start.outputs.service-image }}
  engine-image:
    description: "The engine image it runs, pinned by digest"
    value: ${{ steps.start.outputs.engine-image }}
  runner-host:
    description: "The engine, as _EXPERIMENTAL_DAGGER_RUNNER_HOST"
    value: ${{ steps.start.outputs.runner-host }}
  service-url:
    description: "The service's URL, as the engine and the CLI reach it"
    value: ${{ steps.start.outputs.service-url }}
  service-container:
    description: "The service's container"
    value: ${{ steps.start.outputs.service-container }}
  engine-container:
    description: "The engine's container"
    value: ${{ steps.start.outputs.engine-container }}
  logs:
    description: "Where the stop action puts the service's and the engine's logs"
    value: ${{ steps.start.outputs.logs }}
  debug-token-file:
    description: >-
      With debug-port: the file holding the debug API's token (masked in the
      job's log), removed by the stop; empty otherwise
    value: ${{ steps.start.outputs.debug-token-file }}

runs:
  using: "composite"
  steps:
    - name: Warn that the action is deprecated
      shell: bash
      run: |
        echo "::warning title=remote-cache-sidecar is deprecated::Use zerobull-consulting/dagger/.github/actions/remote-cache/start (and, if you stop explicitly, remote-cache/stop): its start is faster, and it stops the sidecar by itself at the end of the job. remote-cache-sidecar is removed after 2027-02-05, 90 days after remote-cache/start landed (zerobull-consulting/dagger#161)."
    - name: Start the cache service and the engine
      id: start
      shell: bash
      # Inputs reach the script as environment variables only, never
      # expanded into the script itself.
      env:
        SIDECAR_ROLE: ${{ inputs.role }}
        SIDECAR_VERSION: ${{ inputs.version }}
        SIDECAR_SERVICE_IMAGE: ${{ inputs.service-image }}
        SIDECAR_ENGINE_IMAGE: ${{ inputs.engine-image }}
        SIDECAR_NAMESPACE: ${{ inputs.namespace }}
        SIDECAR_DRAIN_TIMEOUT: ${{ inputs.drain-timeout }}
        SIDECAR_NAME: ${{ inputs.name }}
        SIDECAR_DEBUG_PORT: ${{ inputs.debug-port }}
        SIDECAR_VERBOSE: ${{ inputs.verbose }}
        SIDECAR_ENGINE_CONFIG: ${{ inputs.engine-config }}
        CACHESERVICE_S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        CACHESERVICE_S3_REGION: ${{ inputs.s3-region }}
        CACHESERVICE_S3_BUCKET: ${{ inputs.s3-bucket }}
        CACHESERVICE_S3_PREFIX: ${{ inputs.s3-prefix }}
        CACHESERVICE_S3_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        CACHESERVICE_S3_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
        CACHESERVICE_S3_PATH_STYLE: ${{ inputs.s3-path-style }}
      run: '"$GITHUB_ACTION_PATH/../remote-cache/sidecar.sh" start'
