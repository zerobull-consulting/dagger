name: Remote cache accept line
# The "accept line only" check (zerobull-consulting/dagger#117, D5): the
# release check's accept PRs (release-check/accept/<version>) auto-merge,
# so each must add one accept line to cmd/cacheservice/compat/engines.txt
# and change nothing else. Any other PR passes it. When it fails, it turns
# the PR's auto-merge off. Make it a required check before setting
# RELEASE_CHECK_AUTO_MERGE (hack/remote-cache/README.md, "Release check").
#
# The check runs on pull_request_target, so this file and the scripts it
# runs are always the default branch's (feature/remote-cache): a PR that
# edits this workflow, the check or engines.sh is measured by the versions
# it would replace. It runs
# none of the PR's code: it only diffs the PR's commits and parses its
# manifest, with the base's scripts. It requests no environment (only
# schedule and workflow_dispatch jobs may: hack/remote-cache/README.md,
# "Automation tokens"), and its token can only turn auto-merge off.
#
# The release check's own tests run on pull_request, on the PR's code,
# read-only.
"on":
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      # A changed base branch changes the diff.
      - edited
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  accept-line-only:
    name: accept line only
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The PR's head, with the history its merge base needs; no blobs until
      # read, and no persisted credentials. Data only: nothing in it runs.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The default branch's copy of the check and of engines.sh, as this
      # workflow is (GITHUB_SHA, on pull_request_target), so a PR can't
      # weaken the check it's measured by. Never the PR's.
      - name: Check the PR adds only one accept line
        id: check
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          dir="$RUNNER_TEMP/base"
          mkdir -p "$dir"
          for f in accept-line-only.sh engines.sh; do
            git show "$GITHUB_SHA:hack/remote-cache/$f" >"$dir/$f"
            chmod +x "$dir/$f"
          done
          echo "Running the default branch's check ($(git rev-parse --short "$GITHUB_SHA"))."
          echo "CHECK_DIR=$dir" >>"$GITHUB_ENV"
          "$dir/accept-line-only.sh" check "$BASE_SHA" "$HEAD_SHA" "$HEAD_REF"
      - name: Turn auto-merge off
        if: failure() && steps.check.outcome == 'failure'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: '"$CHECK_DIR/accept-line-only.sh" disable-auto-merge "$PR"'

  tests:
    name: release check scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: The release check's tests
        timeout-minutes: 5
        run: ./hack/remote-cache/release-check_test.sh
      - name: The accept-line-only check's tests
        timeout-minutes: 5
        run: ./hack/remote-cache/accept-line-only_test.sh
