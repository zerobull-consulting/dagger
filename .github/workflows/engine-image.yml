name: Engine image
# Builds hack/remote-cache/engine.Dockerfile, the engine with the remote cache
# client, and smoke-tests it against the published cache service
# (hack/remote-cache/engine-image-smoke.sh). Pull requests push nothing.
# Pushes to feature/remote-cache, and workflow_dispatch on it, push
# ghcr.io/zerobull-consulting/dagger-engine:<commit SHA> and the moving
# :feature-remote-cache tag. See hack/remote-cache/README.md, "Engine image".
"on":
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    # Everything in the image's build context
    # (engine.Dockerfile.dockerignore's allowlist), so a change to any
    # package the binaries build from is checked before it merges.
    paths:
      - analytics/**
      - auth/**
      - cmd/codegen/introspection/**
      - cmd/dagger/**
      - cmd/engine/**
      - cmd/init/**
      - cmd/init-session/**
      - core/**
      - dagql/**
      - engine/**
      - internal/**
      - network/**
      - sdk/go/**
      - util/**
      - go.mod
      - go.sum
      - hack/remote-cache/engine.Dockerfile
      - hack/remote-cache/engine.Dockerfile.dockerignore
      - hack/remote-cache/engine-image-smoke.sh
      - .github/workflows/engine-image.yml
  push:
    branches:
      - feature/remote-cache
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  # Pull requests cancel their older runs. Pushes get a group per commit, so
  # none is dropped while another waits, and each pushes its SHA tag; the
  # moving-tag job below serializes the moving tag across them.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/zerobull-consulting/dagger-engine
jobs:
  # Pull requests, and workflow_dispatch on any other branch: build and
  # smoke-test, push nothing.
  build:
    name: image build and smoke test
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/feature/remote-cache'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The Go build runs inside the Dockerfile (the build stage), so the
      # image builds the same from a fresh clone and here; its cache mounts
      # start empty on each runner. The CLI is stamped with the SHA tag the
      # publish job would push, so the smoke test checks the same stamp.
      - name: Build
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build -f hack/remote-cache/engine.Dockerfile \
            --build-arg REVISION="$REVISION" \
            --build-arg ENGINE_IMAGE="$IMAGE:$REVISION" \
            -t dagger-engine:ci .
          docker image inspect dagger-engine:ci \
            --format 'size: {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        env:
          REVISION: ${{ github.sha }}
        run: RUNNER_HOST="image://$IMAGE:$REVISION" ./hack/remote-cache/engine-image-smoke.sh dagger-engine:ci
  # Pushes to feature/remote-cache, and workflow_dispatch on it: build,
  # smoke-test, then push the SHA tag. This job and moving-tag are the only
  # ones with packages: write; neither runs for a pull request.
  publish:
    name: image build, smoke test and push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/remote-cache'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build -f hack/remote-cache/engine.Dockerfile \
            --build-arg REVISION="$REVISION" \
            --build-arg ENGINE_IMAGE="$IMAGE:$REVISION" \
            -t "$IMAGE:$REVISION" .
          docker image inspect "$IMAGE:$REVISION" \
            --format 'size: {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        env:
          REVISION: ${{ github.sha }}
        run: RUNNER_HOST="image://$IMAGE:$REVISION" ./hack/remote-cache/engine-image-smoke.sh "$IMAGE:$REVISION"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$REVISION"
          echo "pushed $IMAGE:$REVISION" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
  # Moves :feature-remote-cache, after a publish pushed its SHA tag, the same
  # way cacheservice-image.yml moves its own: to the branch's head at the time
  # it runs, if that head's SHA tag is pushed, so it never moves backwards.
  moving-tag:
    name: image moving tag
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-moving-tag
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # A registry-side copy of the head's manifest, with the same digest:
      # nothing is pulled or rebuilt.
      - name: Move :feature-remote-cache to the branch head
        run: |
          head="$(git ls-remote origin refs/heads/feature/remote-cache | cut -f1)"
          if ! out="$(docker buildx imagetools inspect "$IMAGE:$head" 2>&1)"; then
            if grep -q 'not found' <<<"$out"; then
              echo "$IMAGE:$head isn't pushed yet: its own run moves the tag" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$out" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:feature-remote-cache" "$IMAGE:$head"
          echo "$IMAGE:feature-remote-cache -> $head" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
