name: Remote cache tests
"on":
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Only runs on the base branch save Go caches (see "Save Go cache"); every
  # PR into it restores them.
  push:
    branches:
      - feature/remote-cache
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's own cache uses one key for every job, so only the first
          # job to finish saves it; each job caches its own build below.
          cache: false
      # Module and build caches, per job (the unit job builds with -race, so
      # its build cache differs). Every run restores the newest cache saved
      # by a push to feature/remote-cache; only those pushes save one (see
      # "Save Go cache"), so PRs don't fill the cache with their own copies.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-unit-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-unit-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      # The remote cache service, the engine's client of it and their wire
      # protocol: every test in these packages.
      - name: Service, client and protocol
        run: go test -race -count=1 -cover ./cmd/cacheservice/... ./engine/remotecache/...
      # The engine's side of the remote cache: its adapter, configuration and
      # fixtures, in packages shared with other engine code.
      - name: Engine integration
        run: |
          go test -race -count=1 -run 'RemoteCache|SkippedMessage|ExportLogAttrs' \
            ./engine/server/ ./cmd/engine/ ./core/schema/
      - name: Save Go cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  minio:
    name: S3 tests against MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's own cache uses one key for every job, so only the first
          # job to finish saves it; each job caches its own build below.
          cache: false
      # Module and build caches, per job (the unit job builds with -race, so
      # its build cache differs). Every run restores the newest cache saved
      # by a push to feature/remote-cache; only those pushes save one (see
      # "Save Go cache"), so PRs don't fill the cache with their own copies.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-minio-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-minio-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-minio-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      # Starts MinIO from hack/remote-cache/compose.yaml and runs the tests
      # in cmd/cacheservice that need a real S3-compatible store.
      - name: MinIO tests
        run: ./hack/remote-cache/dev.sh test
      - name: Stop MinIO
        if: always()
        run: ./hack/remote-cache/dev.sh reset
      - name: Save Go cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  e2e:
    name: real engines (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's own cache uses one key for every job, so only the first
          # job to finish saves it; each job caches its own build below.
          cache: false
      # Module and build caches, per job: this one builds the engine and the
      # CLI. Every run restores the newest cache saved by a push to
      # feature/remote-cache; only those pushes save one.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      # Starts MinIO, builds the engine image from this commit, and runs
      # TestRealEngines in cmd/cacheservice/e2e: the service in-process,
      # engines in Docker. See hack/remote-cache/README.md, "Real engines".
      - name: Real engines
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
        run: ./hack/remote-cache/dev.sh e2e
      # Each run's service logs, CLI output, index and importer state, and
      # the engines' logs when it failed.
      - name: Upload the run's files
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runs
          path: ${{ runner.temp }}/e2e/runs
          if-no-files-found: ignore
      - name: Stop MinIO
        if: always()
        run: ./hack/remote-cache/dev.sh reset
      - name: Save Go cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  # The sidecar demo (hack/remote-cache/demo) through the composite action
  # (.github/actions/remote-cache-sidecar), against MinIO: a writer phase
  # (the action, the demo, the stop, which drains), then a read-only phase on
  # a fresh engine (-export=false and MinIO's read-only user). check.sh counts
  # cache spans in the service's log: the cacheable step must be a hit with
  # 0 executed, and the cache-volume step must rerun. The service's image is
  # built from this checkout, so a pull request tests its own service; the
  # engine is a stock Dagger release (STOCK_ENGINE), whose remote cache
  # client is the one users run.
  sidecar:
    name: sidecar demo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The release's multi-platform index, pinned by digest; update the tag
      # and the digest together, and STOCK_ENGINE_TAG, demo/run.sh's default
      # ENGINE_IMAGE and the docs' examples with them (a step below checks
      # those).
      #
      # Temporary: this pairs the branch's service (internal/version/VERSION,
      # v1.0.0-beta.26 in development) with the v1.0.0-beta.25 engine, a
      # combination the lockstep policy doesn't support (a vX service serves
      # only vX engines). It holds until zerobull-consulting/dagger#117, which
      # repins this to the service's own release and adds a development
      # override for branches that track main.
      STOCK_ENGINE: registry.dagger.io/engine:v1.0.0-beta.25@sha256:39abecfe0eba4c91035dcfc9f72c8a3963ae60481326082b48d78f2230202834
      STOCK_ENGINE_TAG: v1.0.0-beta.25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # sidecar.sh's validation and stop, against a fake docker.
      - name: Test the action's script
        run: ./.github/actions/remote-cache-sidecar/sidecar_test.sh
      # A warning, not a failure: when this branch's engine side of the
      # remote cache (merged from upstream main) differs from the stock
      # engine's, this job doesn't test it, and STOCK_ENGINE should move to
      # the release that has it once there is one. Only a pin that
      # contradicts itself fails the step: a STOCK_ENGINE_TAG that isn't
      # STOCK_ENGINE's own tag, or a digest that isn't the one the registry
      # gives for that tag (the job runs the digest, and compares the code of
      # the tag). A registry or upstream that can't be reached, or a compare
      # that fails, is a warning, so the required check never fails on it.
      - name: Compare the engine's client with the stock engine's
        run: |
          ref="${STOCK_ENGINE%@*}"
          if [[ "${ref##*:}" != "$STOCK_ENGINE_TAG" ]]; then
            echo "::error::STOCK_ENGINE_TAG ($STOCK_ENGINE_TAG) isn't STOCK_ENGINE's tag (${ref##*:}); update them together"
            exit 1
          fi
          if digest="$(timeout 120 docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")"; then
            if [[ "$digest" != "${STOCK_ENGINE##*@}" ]]; then
              echo "::error::$ref is $digest in the registry, not STOCK_ENGINE's ${STOCK_ENGINE##*@}; update the tag and the digest together"
              exit 1
            fi
          else
            echo "::warning::couldn't resolve $ref in the registry; STOCK_ENGINE's digest wasn't checked against it"
          fi
          if ! timeout 300 git fetch -q --depth=1 https://github.com/dagger/dagger "refs/tags/$STOCK_ENGINE_TAG:refs/tags/$STOCK_ENGINE_TAG"; then
            echo "::warning::couldn't fetch $STOCK_ENGINE_TAG from dagger/dagger; the engine's client wasn't compared"
            exit 0
          fi
          # The client, its adapter in the engine, and the bundles it moves.
          paths=(
            engine/remotecache cmd/engine/remotecache.go 'engine/server/remote_cache*.go'
            dagql/cache_transfer_types.go dagql/cache_value_capture.go dagql/cache_value_import.go dagql/cache_stored_bundle.go
            ':!**/*_test.go'
          )
          # Ignored: blank lines only. The pattern can't match an empty
          # string: one that could would ignore every change.
          ignore='^[[:space:]]+$'
          rc=0
          git diff --quiet -I"$ignore" "$STOCK_ENGINE_TAG" HEAD -- "${paths[@]}" || rc=$?
          case "$rc" in
          0) echo "the engine's side of the remote cache is $STOCK_ENGINE_TAG's" ;;
          1)
            echo "::warning::the engine's side of the remote cache differs from $STOCK_ENGINE_TAG's, which this job runs:"
            git diff --stat -I"$ignore" "$STOCK_ENGINE_TAG" HEAD -- "${paths[@]}" || true
            ;;
          *) echo "::warning::couldn't compare the engine's client with $STOCK_ENGINE_TAG's (git diff exited $rc)" ;;
          esac
      # dev.sh demo runs the engine this job does: run.sh's default is this
      # pin, as one literal line. Every digest-pinned stock engine the remote
      # cache's docs and scripts name is this pin too, so a bump can't leave
      # an example behind.
      - name: Check the demo's default engine and the docs' examples are STOCK_ENGINE
        run: |
          want=": \"\${ENGINE_IMAGE:=$STOCK_ENGINE}\""
          grep -qxF "$want" hack/remote-cache/demo/run.sh ||
            { echo "::error file=hack/remote-cache/demo/run.sh::its default ENGINE_IMAGE isn't STOCK_ENGINE ($STOCK_ENGINE)"; exit 1; }
          stale="$(grep -rnoE 'registry\.dagger\.io/engine:[^ "`)]*@sha256:[0-9a-f]{64}' \
            hack/remote-cache cmd/cacheservice .github/actions/remote-cache-sidecar | grep -vF ":$STOCK_ENGINE" || true)"
          [[ -z "$stale" ]] || { echo "::error::pinned engines other than STOCK_ENGINE ($STOCK_ENGINE):"; echo "$stale"; exit 1; }
      # The service as cacheservice-image.yml builds it; the engine pulled
      # alongside, bounded as the action's own pull is (15 minutes).
      - name: Build the service's image, pull the engine's
        env:
          REVISION: ${{ github.sha }}
        run: |
          timeout 900 docker pull -q "$STOCK_ENGINE" &
          docker build -f cmd/cacheservice/Dockerfile \
            --build-arg REVISION="$REVISION" -t cacheservice:ci .
          wait $!
      # MinIO on the Docker bridge gateway, where the sidecar's containers
      # reach it, with a read-only user for the demo's prefix (demo/). The
      # credentials are MinIO's committed dev ones.
      - name: Start MinIO
        id: store
        run: ./hack/remote-cache/dev.sh demo-store >>"$GITHUB_OUTPUT"
      - name: "Writer: start the sidecar"
        id: writer
        uses: ./.github/actions/remote-cache-sidecar
        with:
          role: writer
          name: demo-writer
          service-image: cacheservice:ci
          engine-image: ${{ env.STOCK_ENGINE }}
          s3-endpoint: ${{ steps.store.outputs.endpoint }}
          s3-region: ${{ steps.store.outputs.region }}
          s3-bucket: ${{ steps.store.outputs.bucket }}
          s3-prefix: demo/${{ github.run_id }}-${{ github.run_attempt }}
          s3-access-key-id: ${{ steps.store.outputs.access-key-id }}
          s3-secret-access-key: ${{ steps.store.outputs.secret-access-key }}
          s3-path-style: "true"
          verbose: "true"
          debug-port: "8091"
      # The debug API through debug-port: 401 without the generated token,
      # and the connected engine with it.
      - name: "Writer: check the debug API takes only its token"
        env:
          TOKEN_FILE: ${{ steps.writer.outputs.debug-token-file }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/debug/engines)"
          [[ "$code" == 401 ]] || { echo "::error::without the token: $code, want 401"; exit 1; }
          # The header from a file descriptor: the token on no command line.
          curl -fsS -H @<(printf 'Authorization: Bearer %s\n' "$(cat "$TOKEN_FILE")") http://127.0.0.1:8091/debug/engines | grep -q '"conn"' ||
            { echo "::error::with the token: no engine listed"; exit 1; }
      - name: "Writer: run the demo"
        timeout-minutes: 10
        env:
          SERVICE: ${{ steps.writer.outputs.service-container }}
          DAGGER: ${{ steps.writer.outputs.dagger }}
        run: ./hack/remote-cache/demo/check.sh writer "$SERVICE" "$RUNNER_TEMP/demo/writer"
      - name: "Writer: stop the sidecar"
        id: writer-stop
        if: always()
        # Above the drain timeout (10m) plus 5s.
        timeout-minutes: 12
        uses: ./.github/actions/remote-cache-sidecar/stop
        with:
          name: demo-writer
      - name: "Writer: check the export was stored"
        env:
          LOGS: ${{ steps.writer-stop.outputs.logs }}
        run: ./hack/remote-cache/demo/check.sh stored "$LOGS/service.log" "$RUNNER_TEMP/demo/writer"
      # A new engine, with a new, empty state volume: the writer's was
      # removed by its stop.
      - name: "Read-only: start the sidecar"
        id: reader
        uses: ./.github/actions/remote-cache-sidecar
        with:
          role: read-only
          name: demo-reader
          service-image: cacheservice:ci
          engine-image: ${{ env.STOCK_ENGINE }}
          s3-endpoint: ${{ steps.store.outputs.endpoint }}
          s3-region: ${{ steps.store.outputs.region }}
          s3-bucket: ${{ steps.store.outputs.bucket }}
          s3-prefix: demo/${{ github.run_id }}-${{ github.run_attempt }}
          s3-access-key-id: ${{ steps.store.outputs.readonly-access-key-id }}
          s3-secret-access-key: ${{ steps.store.outputs.readonly-secret-access-key }}
          s3-path-style: "true"
          verbose: "true"
      - name: "Read-only: run the demo"
        timeout-minutes: 10
        env:
          SERVICE: ${{ steps.reader.outputs.service-container }}
          DAGGER: ${{ steps.reader.outputs.dagger }}
        run: ./hack/remote-cache/demo/check.sh read-only "$SERVICE" "$RUNNER_TEMP/demo/read-only" "$RUNNER_TEMP/demo/writer"
      - name: "Read-only: stop the sidecar"
        if: always()
        timeout-minutes: 12
        uses: ./.github/actions/remote-cache-sidecar/stop
        with:
          name: demo-reader
      # The service's and the engine's logs of both phases (presigned URLs'
      # credentials redacted), and the demo's CLI output.
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sidecar-demo
          path: |
            ${{ runner.temp }}/remote-cache-sidecar/*/logs
            ${{ runner.temp }}/demo
          if-no-files-found: ignore
      - name: Stop MinIO
        if: always()
        run: ./hack/remote-cache/dev.sh reset
  # Runs the Spaces jobs below only where the SPACES_* secrets are set: a job's
  # `if` can't read secrets, so this one answers for them. Forks and repositories
  # without them skip those jobs. Anyone with write access can read repository
  # secrets through a workflow on a branch, so use a key for a dedicated test
  # bucket. See hack/remote-cache/README.md, "Testing against a real bucket".
  spaces-config:
    name: Spaces configured?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the secrets
        id: check
        env:
          ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          REGION: ${{ secrets.SPACES_REGION }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          PREFIX: ${{ secrets.SPACES_PREFIX }}
          ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$ENDPOINT" && -n "$REGION" && -n "$BUCKET" && -n "$PREFIX" && -n "$ACCESS_KEY_ID" && -n "$SECRET_ACCESS_KEY" ]]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "configured=false" >>"$GITHUB_OUTPUT"
          fi
  # Both Spaces jobs work under fresh prefixes below SPACES_PREFIX
  # (<prefix>/<run>/ for each test, <prefix>/e2e/<run>/ for the e2e), so the
  # service's startup ownership check always finds an empty prefix and claims
  # it. Leftovers of earlier runs, of any layout, sit in other runs'
  # prefixes, which nothing here reads or deletes; a run whose prefix wasn't
  # empty would fail at the check, not clean it up.
  spaces-store:
    name: S3 tests against Spaces
    needs: spaces-config
    if: needs.spaces-config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Store suites
        # On this step only, not the job: the other steps run third-party actions.
        env:
          CACHESERVICE_TEST_EXTERNAL: "1"
          CACHESERVICE_TEST_STORE: spaces
          CACHESERVICE_TEST_DISPOSABLE_BUCKET: ${{ secrets.SPACES_DISPOSABLE_BUCKET }}
          CACHESERVICE_S3_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          CACHESERVICE_S3_REGION: ${{ secrets.SPACES_REGION }}
          CACHESERVICE_S3_BUCKET: ${{ secrets.SPACES_BUCKET }}
          CACHESERVICE_S3_PREFIX: ${{ secrets.SPACES_PREFIX }}
          CACHESERVICE_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          CACHESERVICE_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          CACHESERVICE_S3_PATH_STYLE: "false"
        run: ./hack/remote-cache/dev.sh test
  # No upload of the run's files, unlike the e2e job: their logs name the bucket.
  spaces-e2e:
    name: real engines (e2e) against Spaces
    needs: spaces-config
    if: needs.spaces-config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Real engines
        # On this step only, not the job: the other steps run third-party actions.
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
          CACHESERVICE_TEST_EXTERNAL: "1"
          CACHESERVICE_TEST_STORE: spaces
          CACHESERVICE_S3_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          CACHESERVICE_S3_REGION: ${{ secrets.SPACES_REGION }}
          CACHESERVICE_S3_BUCKET: ${{ secrets.SPACES_BUCKET }}
          CACHESERVICE_S3_PREFIX: ${{ secrets.SPACES_PREFIX }}
          CACHESERVICE_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          CACHESERVICE_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          CACHESERVICE_S3_PATH_STYLE: "false"
        run: ./hack/remote-cache/dev.sh e2e
