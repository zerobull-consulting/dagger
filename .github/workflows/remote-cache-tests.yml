name: Remote cache tests
"on":
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Only runs on the base branch save Go caches (see "Save Go cache"); every
  # PR into it restores them.
  push:
    branches:
      - feature/remote-cache
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's own cache uses one key for every job, so only the first
          # job to finish saves it; each job caches its own build below.
          cache: false
      # Module and build caches, per job (the unit job builds with -race, so
      # its build cache differs). Every run restores the newest cache saved
      # by a push to feature/remote-cache; only those pushes save one (see
      # "Save Go cache"), so PRs don't fill the cache with their own copies.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-unit-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-unit-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      # The remote cache service, the engine's client of it and their wire
      # protocol: every test in these packages.
      - name: Service, client and protocol
        run: go test -race -count=1 -cover ./cmd/cacheservice/... ./engine/remotecache/...
      # The engine's side of the remote cache: its adapter, configuration and
      # fixtures, in packages shared with other engine code.
      - name: Engine integration
        run: |
          go test -race -count=1 -run 'RemoteCache|SkippedMessage|ExportLogAttrs' \
            ./engine/server/ ./cmd/engine/ ./core/schema/
      - name: Save Go cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  minio:
    name: S3 tests against MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's own cache uses one key for every job, so only the first
          # job to finish saves it; each job caches its own build below.
          cache: false
      # Module and build caches, per job (the unit job builds with -race, so
      # its build cache differs). Every run restores the newest cache saved
      # by a push to feature/remote-cache; only those pushes save one (see
      # "Save Go cache"), so PRs don't fill the cache with their own copies.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-minio-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-minio-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-minio-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      # Starts MinIO from hack/remote-cache/compose.yaml and runs the tests
      # in cmd/cacheservice that need a real S3-compatible store.
      - name: MinIO tests
        run: ./hack/remote-cache/dev.sh test
      - name: Stop MinIO
        if: always()
        run: ./hack/remote-cache/dev.sh reset
      - name: Save Go cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  e2e:
    name: real engines (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's own cache uses one key for every job, so only the first
          # job to finish saves it; each job caches its own build below.
          cache: false
      # Module and build caches, per job: this one builds the engine and the
      # CLI. Every run restores the newest cache saved by a push to
      # feature/remote-cache; only those pushes save one.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-e2e-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      # Starts MinIO, builds the engine image from this commit, and runs
      # TestRealEngines in cmd/cacheservice/e2e: the service in-process,
      # engines in Docker. See hack/remote-cache/README.md, "Real engines".
      - name: Real engines
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
        run: ./hack/remote-cache/dev.sh e2e
      # Each run's service logs, CLI output, index and importer state, and
      # the engines' logs when it failed.
      - name: Upload the run's files
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runs
          path: ${{ runner.temp }}/e2e/runs
          if-no-files-found: ignore
      - name: Stop MinIO
        if: always()
        run: ./hack/remote-cache/dev.sh reset
      - name: Save Go cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  # Runs the Spaces jobs below only where the SPACES_* secrets are set: a job's
  # `if` can't read secrets, so this one answers for them. Forks and repositories
  # without them skip those jobs. Anyone with write access can read repository
  # secrets through a workflow on a branch, so use a key for a dedicated test
  # bucket. See hack/remote-cache/README.md, "Testing against a real bucket".
  spaces-config:
    name: Spaces configured?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the secrets
        id: check
        env:
          ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          REGION: ${{ secrets.SPACES_REGION }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          PREFIX: ${{ secrets.SPACES_PREFIX }}
          ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$ENDPOINT" && -n "$REGION" && -n "$BUCKET" && -n "$PREFIX" && -n "$ACCESS_KEY_ID" && -n "$SECRET_ACCESS_KEY" ]]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "configured=false" >>"$GITHUB_OUTPUT"
          fi
  spaces-store:
    name: S3 tests against Spaces
    needs: spaces-config
    if: needs.spaces-config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Store suites
        # On this step only, not the job: the other steps run third-party actions.
        env:
          CACHESERVICE_TEST_EXTERNAL: "1"
          CACHESERVICE_TEST_STORE: spaces
          CACHESERVICE_TEST_DISPOSABLE_BUCKET: ${{ secrets.SPACES_DISPOSABLE_BUCKET }}
          CACHESERVICE_S3_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          CACHESERVICE_S3_REGION: ${{ secrets.SPACES_REGION }}
          CACHESERVICE_S3_BUCKET: ${{ secrets.SPACES_BUCKET }}
          CACHESERVICE_S3_PREFIX: ${{ secrets.SPACES_PREFIX }}
          CACHESERVICE_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          CACHESERVICE_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          CACHESERVICE_S3_PATH_STYLE: "false"
        run: ./hack/remote-cache/dev.sh test
  # No upload of the run's files, unlike the e2e job: their logs name the bucket.
  spaces-e2e:
    name: real engines (e2e) against Spaces
    needs: spaces-config
    if: needs.spaces-config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Real engines
        # On this step only, not the job: the other steps run third-party actions.
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
          CACHESERVICE_TEST_EXTERNAL: "1"
          CACHESERVICE_TEST_STORE: spaces
          CACHESERVICE_S3_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          CACHESERVICE_S3_REGION: ${{ secrets.SPACES_REGION }}
          CACHESERVICE_S3_BUCKET: ${{ secrets.SPACES_BUCKET }}
          CACHESERVICE_S3_PREFIX: ${{ secrets.SPACES_PREFIX }}
          CACHESERVICE_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          CACHESERVICE_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          CACHESERVICE_S3_PATH_STYLE: "false"
        run: ./hack/remote-cache/dev.sh e2e
