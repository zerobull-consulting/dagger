name: Remote cache smoke test on Spaces
# The remote cache sidecar against the real bucket PR checks will use, through
# the two GitHub Environments that hold its settings and keys:
#
#   pr-checks-readwrite  CACHE_S3_*       a Read/Write/Delete key, for the writer
#   pr-checks-readonly   CACHE_S3_READ_*  a Read key, for the reader
#
# Both point at the same bucket and prefix (cache-<engine version>). The writer
# job runs the demo, stores its export and stops; the reader job then starts a
# fresh engine with a read-only sidecar and checks the demo's cacheable step
# comes back as a hit, with the writer's stamp (hack/remote-cache/demo/check.sh,
# as the MinIO `sidecar demo` job does).
#
# The prefix is shared and persists, so the demo's cacheable step gets a nonce
# of its own per run (DEMO_NONCE): the writer executes it every run, and the
# reader, given the same nonce, gets it from the bucket. Each run leaves one
# small entry in the prefix.
#
# Not on pull requests: only the writer's push and a manual run reach the
# secrets. The engine version is pinned below, not read from the manifest's
# first accept line, so a new accept line doesn't change what this tests; move
# VERSION and the environments' CACHE_S3_PREFIX together.
"on":
  push:
    branches:
      - feature/remote-cache
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: v1.0.0-beta.25
  # What some runners export: an unsampled trace. The CLI the start sets up
  # must not continue it (see the sidecar demo job).
  TRACEPARENT: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-00
jobs:
  writer:
    name: writer
    runs-on: ubuntu-24.04
    environment: pr-checks-readwrite
    # The work, the drain (10m) and the stop's 2 minutes.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify the sidecar is stopped at the job's end
        uses: ./hack/remote-cache/ci/verify-stopped
        with:
          names: smoke-writer
      - name: Start the writer sidecar
        id: writer
        uses: ./.github/actions/remote-cache/start
        with:
          role: writer
          name: smoke-writer
          version: ${{ env.VERSION }}
          verbose: "true"
          s3-endpoint: ${{ vars.CACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.CACHE_S3_REGION }}
          s3-bucket: ${{ vars.CACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.CACHE_S3_PREFIX }}
          s3-access-key-id: ${{ secrets.CACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.CACHE_S3_SECRET_ACCESS_KEY }}
      - name: Run the demo
        timeout-minutes: 10
        env:
          SERVICE: ${{ steps.writer.outputs.service-container }}
          DAGGER: ${{ steps.writer.outputs.dagger }}
          DEMO_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./hack/remote-cache/demo/check.sh writer "$SERVICE" "$RUNNER_TEMP/smoke/writer"
      # The drain must be done before the reader starts.
      - name: Stop the writer sidecar
        id: stop
        if: always()
        timeout-minutes: 12
        uses: ./.github/actions/remote-cache/stop
        with:
          name: smoke-writer
      - name: Check the export was stored
        env:
          LOGS: ${{ steps.stop.outputs.logs }}
        run: ./hack/remote-cache/demo/check.sh stored "$LOGS/service.log" "$RUNNER_TEMP/smoke/writer"
      # The stamp and the writer's engine cache ID, for the reader's checks.
      - name: Upload the writer's result
        uses: actions/upload-artifact@v6
        with:
          name: smoke-writer-result
          path: |
            ${{ runner.temp }}/smoke/writer/stamp
            ${{ runner.temp }}/smoke/writer/writer-cache
      # The logs name the bucket and the prefix; only on failure.
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-writer-logs
          path: ${{ runner.temp }}/remote-cache-sidecar/*/logs
          if-no-files-found: ignore

  reader:
    name: reader
    needs: writer
    runs-on: ubuntu-24.04
    environment: pr-checks-readonly
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify the sidecar is stopped at the job's end
        uses: ./hack/remote-cache/ci/verify-stopped
        with:
          names: smoke-reader
      - name: Download the writer's result
        uses: actions/download-artifact@v7
        with:
          name: smoke-writer-result
          path: ${{ runner.temp }}/smoke/writer
      - name: Start the read-only sidecar
        id: reader
        uses: ./.github/actions/remote-cache/start
        with:
          role: read-only
          name: smoke-reader
          version: ${{ env.VERSION }}
          verbose: "true"
          s3-endpoint: ${{ vars.CACHE_S3_READ_ENDPOINT }}
          s3-region: ${{ vars.CACHE_S3_READ_REGION }}
          s3-bucket: ${{ vars.CACHE_S3_READ_BUCKET }}
          s3-prefix: ${{ vars.CACHE_S3_READ_PREFIX }}
          s3-access-key-id: ${{ secrets.CACHE_S3_READ_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.CACHE_S3_READ_SECRET_ACCESS_KEY }}
      - name: Run the demo
        timeout-minutes: 10
        env:
          SERVICE: ${{ steps.reader.outputs.service-container }}
          DAGGER: ${{ steps.reader.outputs.dagger }}
          # The writer's nonce: same run, so the cacheable step has its key.
          DEMO_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./hack/remote-cache/demo/check.sh read-only "$SERVICE" "$RUNNER_TEMP/smoke/read-only" "$RUNNER_TEMP/smoke/writer"
      # On failure only: the start's post step stops it otherwise, after the
      # upload, so its logs would not exist yet.
      - name: Stop the read-only sidecar, to upload its logs
        if: failure()
        timeout-minutes: 12
        uses: ./.github/actions/remote-cache/stop
        with:
          name: smoke-reader
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-reader-logs
          path: ${{ runner.temp }}/remote-cache-sidecar/*/logs
          if-no-files-found: ignore
