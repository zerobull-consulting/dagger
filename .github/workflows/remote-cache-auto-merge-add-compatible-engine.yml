name: Remote cache auto-merge add compatible engine
# The "auto-merge: adds compatible engine only" check (zerobull-consulting/dagger#117, D5): the
# release check's accept PRs (release-check/accept/<version>) auto-merge,
# so each must add one accept line to cmd/cacheservice/compat/engines.txt
# and change nothing else. Any other PR passes it. When it fails, it turns
# the PR's auto-merge off. Make it a required check before setting
# RELEASE_CHECK_AUTO_MERGE (hack/remote-cache/README.md, "Release check").
#
# It runs on pull_request_target, so this file and the scripts it runs are
# always the default branch's (feature/remote-cache): a PR that edits this
# workflow, the check or engines.sh is measured by the versions it would
# replace. It runs none of the PR's code: it only diffs the PR's commits and
# parses its manifest. It requests no environment (only schedule and
# workflow_dispatch jobs may: hack/remote-cache/README.md, "Automation
# tokens"), and its token (actions: read, pull-requests: write) is used by
# the scripts only to read the run an accept line cites (and its jobs) and to turn
# auto-merge off. It has no
# pull_request trigger, so no skipped job of the same name ever reports (a
# skipped required check counts as passed). The release check's own tests
# run in remote-cache-tests.yml's unit job.
"on":
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      # A changed base branch changes the diff.
      - edited
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge-add-compatible-engine:
    name: "auto-merge: adds compatible engine only"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads the run an accept line cites, and its jobs
      # (accept-line-only.sh, verify_run).
      actions: read
      pull-requests: write
    steps:
      # The default branch (pull_request_target's own checkout), with the
      # history the PR's merge base needs; no blobs until read, and no
      # persisted credentials. The PR's head comes in the next step.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      # The default branch's copy of the check (with the engine-jobs.sh it
      # sources) and of engines.sh, as this
      # workflow is (GITHUB_SHA, on pull_request_target), so a PR can't
      # weaken the check it's measured by. Never the PR's. The PR's head
      # is fetched, not checked out: the check reads commits only. It comes
      # from refs/pull/<N>/head, fetched explicitly, so it works
      # for a fork's PR too, whose commit is on no branch of this repository
      # (zerobull-consulting/dagger#165).
      - name: Check the PR adds only one accept line
        id: check
        # fetch-head is bounded at 300s, and the check's two reads of the
        # cited run (the run, its jobs) at 70s each (three 20s tries, 5s
        # apart): 440s in all, within 8 minutes, so the check's own
        # annotation says why it failed rather than the step timing out.
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          dir="$RUNNER_TEMP/base"
          mkdir -p "$dir"
          for f in accept-line-only.sh engine-jobs.sh engines.sh; do
            git show "$GITHUB_SHA:hack/remote-cache/$f" >"$dir/$f"
            chmod +x "$dir/$f"
          done
          echo "Running the default branch's check ($(git rev-parse --short "$GITHUB_SHA"))."
          echo "CHECK_DIR=$dir" >>"$GITHUB_ENV"
          "$dir/accept-line-only.sh" fetch-head "$PR" "$HEAD_SHA" "$HEAD_REF"
          "$dir/accept-line-only.sh" check "$BASE_SHA" "$HEAD_SHA" "$HEAD_REF"
      - name: Turn auto-merge off
        if: failure() && steps.check.outcome == 'failure'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: '"$CHECK_DIR/accept-line-only.sh" disable-auto-merge "$PR"'
