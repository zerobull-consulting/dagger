name: "Remote cache: verify the sidecars were stopped"
description: >-
  CI only. Declared before remote-cache/start, its post step runs after the
  start's own post steps (which run in reverse order), and fails the job
  unless they stopped the sidecars: no container, volume or network of a
  sidecar is left, and each named sidecar left its logs. A sidecar that an
  explicit remote-cache/stop stopped before is stopped as well.

inputs:
  names:
    description: "The sidecars' names, space separated, that must be stopped"
    required: true
  stopped-by-post:
    description: "The names, space separated, that no explicit stop stopped: the post step did, and left logs"
    required: false
    default: ""

runs:
  using: node24
  main: noop.js
  post: post.js
  post-if: always()
