# Local S3-compatible store for developing and testing the remote cache
# service (cmd/cacheservice). See README.md in this directory.
#
# Start it with ./hack/remote-cache/dev.sh up, not `docker compose up`
# directly: the script waits for the bucket and prints the settings to use.

name: dagger-remote-cache

x-minio-image: &minio-image pgsty/silo:RELEASE.2026-10-26T00-00-00Z

services:
  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dagger-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dagger-dev-secret}
      # Presigned URLs carry a region in their signature. Pin it so it matches
      # what the service is configured with.
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    # Loopback only by default: the root credentials are committed in this
    # repo. Set MINIO_BIND_ADDR to the Docker bridge gateway (usually
    # 172.17.0.1) to let an engine container reach MinIO without exposing it
    # beyond this host. See README.md.
    ports:
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates the bucket, then exits. Safe to run again: --ignore-existing.
  # The MinIO image ships mc, so no second image to pin.
  create-bucket:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dagger-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dagger-dev-secret}
      BUCKET: ${MINIO_BUCKET:-dagger-cache}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$BUCKET"
    restart: "no"

  # Creates a user that can only read under the test prefix, for the tests of
  # a read-only instance (-export=false): s3:GetObject on the prefix's
  # objects, and s3:ListBucket limited to the prefix. Safe to run again.
  create-readonly-user:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dagger-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dagger-dev-secret}
      BUCKET: ${MINIO_BUCKET:-dagger-cache}
      PREFIX: ${READONLY_PREFIX:-test}
      READONLY_USER: ${READONLY_USER:-dagger-readonly}
      READONLY_PASSWORD: ${READONLY_PASSWORD:-dagger-readonly-secret}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        printf '{"Version":"2012-10-17","Statement":[
        {"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/%s/*"]},
        {"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::%s"],"Condition":{"StringLike":{"s3:prefix":["%s/*"]}}}]}'
        "$$BUCKET" "$$PREFIX" "$$BUCKET" "$$PREFIX" > /tmp/readonly.json &&
        mc admin policy create local cacheservice-readonly /tmp/readonly.json &&
        mc admin user add local "$$READONLY_USER" "$$READONLY_PASSWORD" &&
        { mc admin policy attach local cacheservice-readonly --user "$$READONLY_USER" ||
          mc admin user info local "$$READONLY_USER" | grep -q cacheservice-readonly; }
    restart: "no"

volumes:
  minio-data:
